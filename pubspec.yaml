name: sats
description: Bitcoin Key Manager
version: 0.1.2+24
publish_to: none
platforms:
  android:

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  animate_do: ^5.1.0
  bdk_dart: ^1.0.0
  bip39: ^1.0.6
  bloc: ^9.2.1
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  mobile_scanner: ^7.4.2
  numeric_keyboard: ^1.1.0
  oktoast: ^3.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pattern_formatter: ^4.0.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  sqflite: ^2.4.2+1
  top_snackbar_flutter: ^3.4.0
  tor: ^0.1.1
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  hive_ce_generator: ^1.10.0
  json_serializable: ^6.11.2
  lint: ^2.11.0
  mocktail: ^1.0.5
  test: ^1.26.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/sm92.png
    - assets/icon/bitcoin_icons/png/outline/node.png
    - assets/icon/bitcoin_icons/png/outline/home.png
    - assets/icon/bitcoin_icons/png/outline/ellipsis.png
    - assets/icon/bitcoin_icons/png/outline/satoshi-v2.png
    - assets/icon/bitcoin_icons/png/outline/proxy.png
    - assets/icon/bitcoin_icons/png/outline/link.png
    - assets/bip39_english.txt
  fonts:
    - family: NF3270
      fonts:
        - asset: assets/3270-Medium.otf
        - asset: assets/3270-Narrow.otf
    - family: Hurmit
      fonts:
        - asset: assets/Hurmit-Light.otf
        - asset: assets/Hurmit-Medium.otf
        - asset: assets/Hurmit-Bold.otf
    - family: Aldrich
      fonts:
        - asset: assets/Aldrich/Aldrich-Regular.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/sm92.png"
