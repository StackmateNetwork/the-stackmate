name: sats
description: Bitcoin Key Manager
version: 0.1.2+24
publish_to: none
platforms:
  android:

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  animate_do: ^5.1.0
  bdk_dart: ^1.0.1
  bloc: ^9.2.1
  crypto: ^3.0.8
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.11.0
  mobile_scanner: ^7.5.0
  numeric_keyboard: ^1.1.0
  oktoast: ^3.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pattern_formatter: ^5.0.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  sqflite: ^2.4.6
  top_snackbar_flutter: ^3.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  hive_ce_generator: ^1.12.1
  json_serializable: ^6.15.2
  lint: ^2.14.0
  mocktail: ^1.0.5
  test: ^1.32.0


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/sm92.png
    - assets/icon/bitcoin_icons/png/outline/node.png
    - assets/icon/bitcoin_icons/png/outline/home.png
    - assets/icon/bitcoin_icons/png/outline/ellipsis.png
    - assets/icon/bitcoin_icons/png/outline/satoshi-v2.png
    - assets/icon/bitcoin_icons/png/outline/proxy.png
    - assets/icon/bitcoin_icons/png/outline/link.png
    - assets/bip39_english.txt
  fonts:
    - family: NF3270
      fonts:
        - asset: assets/3270-Medium.otf
        - asset: assets/3270-Narrow.otf
    - family: Hurmit
      fonts:
        - asset: assets/Hurmit-Light.otf
        - asset: assets/Hurmit-Medium.otf
        - asset: assets/Hurmit-Bold.otf
    - family: Aldrich
      fonts:
        - asset: assets/Aldrich/Aldrich-Regular.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/sm92.png"
