include: package:lint/analysis_options.yaml
# package: flutter_lints/flutter.yaml

linter:
  rules:
    file_names: false
    avoid_classes_with_only_static_members: false
    sort_constructors_first: true
    prefer_single_quotes: true
    sized_box_for_whitespace: false
    prefer_interpolation_to_compose_strings: false
    avoid_print: false
    # always_specify_types: true
    # const_initialized_with_non_constant_value: false
    # import_of_legacy_library_into_null_safe: false
    avoid_positional_boolean_parameters: false
    use_string_buffers: false
    join_return_with_assignment: false
    unnecessary_string_escapes: false
    # style-only; many cubit methods are fire-and-forget `void f() async`
    unnecessary_async: false
    # Dart 3.14 primary-constructor style; not adopted yet (style only, and
    # freezed/json/hive classes still need regular constructors).
    use_primary_constructors: false
    unnecessary_type_name_in_constructor: false
    empty_container_bodies: false

analyzer:
  exclude:
    - lib/pkg/words/app_localizations*.dart
    - lib/model/*.g.dart
    - lib/model/*.freezed.dart
    - lib/cubit/*.freezed.dart
    - lib/cubit/*/*.freezed.dart
    - lib/cubit/new-wallet/*.freezed.dart
    - lib/cubit/new-wallet/*.freezed.dart
    - lib/cubit/new-wallet/common/*.freezed.dart
    - lib/cubit/new-wallet/common/*.freezed.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**
    - linux/**
